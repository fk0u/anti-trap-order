<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1280px;height:720px;overflow:hidden}
  body{font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;position:relative;
    background:linear-gradient(180deg,#5fe3f7 0%,#a9eefb 55%,#e8fbff 100%);}
  .glow{position:absolute;right:-120px;top:-160px;width:760px;height:760px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,255,255,0) 68%)}
  .chip{position:absolute;left:64px;top:54px;background:#fff;border:3px solid #000;border-radius:999px;
    padding:10px 24px;font-weight:800;font-size:26px;letter-spacing:.14em;color:#0e7490;box-shadow:4px 4px 0 #000}
  h1{position:absolute;left:60px;top:128px;width:600px;font-weight:900;font-size:84px;line-height:1.02;color:#fff;
    letter-spacing:-.02em;-webkit-text-stroke:9px #0b1b2a;paint-order:stroke fill;text-shadow:5px 6px 0 #0b1b2a}
  h1 span{color:#ffda37}
  .brand{position:absolute;left:64px;bottom:128px;font-weight:900;font-size:46px;color:#0b1b2a;letter-spacing:-.01em}
  .tag{position:absolute;left:64px;bottom:54px;background:#0e7490;color:#fff;border:3px solid #000;border-radius:16px;
    padding:12px 26px;font-weight:800;font-size:30px;box-shadow:5px 5px 0 #000;white-space:nowrap}
  .phone{position:absolute;width:318px;height:688px;border:6px solid #000;border-radius:44px;overflow:hidden;background:#fff;
    box-shadow:12px 14px 0 #000}
  .phone img{width:100%;display:block}
  .p1{right:300px;top:56px;transform:rotate(-5deg);z-index:2}
  .p2{right:-8px;top:96px;transform:rotate(6deg);z-index:1}
</style></head>
<body>
  <div class="glow"></div>
  <div class="chip">MIT-WEEK UNMUL 2026</div>
  <h1>Jangan hanya<br>waspada.<br><span>Jadilah<br>penjaganya.</span></h1>
  <div class="brand">Anti Trap Order (ATO)</div>
  <div class="tag">Temukan celahnya sendiri</div>
  <div class="phone p2"><img src="video/media/07a-soul-karakter.png"></div>
  <div class="phone p1"><img src="video/media/04-q1.png"></div>
</body></html>
